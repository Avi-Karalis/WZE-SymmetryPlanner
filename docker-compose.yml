services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRESPSW:?POSTGRESPSW must be set in the env file}
      POSTGRES_DB: ${DB_NAME:-WZE-Symmetry-Planner}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: WZE-Symmetry-Planner/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      POSTGRESPSW: ${POSTGRESPSW:?POSTGRESPSW must be set in the env file}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-WZE-Symmetry-Planner}
      DB_USER: ${DB_USER:-postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in the env file}
      JWT_ISSUER: ${JWT_ISSUER:-wze-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-wze-front}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://front:3000}
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

  front:
    build:
      context: ./Front
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: http://localhost:8080/api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8080/api

volumes:
  pgdata:
